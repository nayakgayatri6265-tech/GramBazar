
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Products</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f4f4;
        }
        h1 {
            text-align: center;
            color: #222;
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .product {
            background: white;
            padding: 15px;
            width: 200px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px #ccc;
        }
        .product img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Our Products</h1>

    <div class="products">
        <div class="product">
            <img src="https://placehold.co/200x150?text=Product+1"
                 alt="Product 1">
            <h3>Product 1</h3>
            <p>Price: ₹499</p>
            <button onclick="alert('Product 1 selected!')">
                Buy Now
            </button>
        </div>

        <div class="product">
            <img src="https://placehold.co/200x150?text=Product+2"
                 alt="Product 2">
            <h3>Product 2</h3>
            <p>Price: ₹799</p>
            <button onclick="alert('Product 2 selected!')">
                Buy Now
            </button>
        </div>
    </div>

</body>
</html>
